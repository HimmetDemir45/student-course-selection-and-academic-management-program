[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    "**/migrations/**",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"**/tests.py" = ["F401"]

[tool.coverage.run]
source = [
    "accounts",
    "academic",
    "audit_logs",
    "config",
    "core",
    "courses",
    "dashboard",
    "enrollments",
    "instructors",
    "students",
]
omit = ["*/migrations/*", "manage.py"]

[tool.coverage.report]
fail_under = 75
show_missing = true
