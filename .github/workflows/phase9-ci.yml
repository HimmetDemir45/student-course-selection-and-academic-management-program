name: Phase 9 CI Gates

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  phase9-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: github_actions
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      DJANGO_SECRET_KEY: ci-ephemeral-placeholder-not-for-production
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/github_actions
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Django check + migrate
        run: |
          python manage.py check
          python manage.py migrate --noinput

      - name: Security gate (pip-audit + bandit + detect-secrets)
        run: |
          python -m pip_audit -r requirements.txt --strict
          bandit -c .bandit -r . -x "./tests,./.venv,./venv" -ll
          test -f .secrets.baseline
          detect-secrets scan --baseline .secrets.baseline --all-files
          detect-secrets audit .secrets.baseline --stats

      - name: Unit tests
        run: |
          pytest -m "unit" --maxfail=1

      - name: Integration tests
        run: |
          pytest -m "integration" --maxfail=1

      - name: Smoke tests
        run: |
          pytest -m "smoke" --maxfail=1

      - name: Migration smoke (apply + rollback + re-apply)
        run: |
          chmod +x scripts/smoke_migration.sh
          ./scripts/smoke_migration.sh

      - name: Coverage gate (global >=80, critical >=90)
        run: |
          pytest \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -m "unit or integration or smoke or concurrency or security"

          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage.xml").getroot()
          modules = {
              "enrollments": [],
              "academic": [],
              "accounts": [],
          }

          for cls in root.findall(".//class"):
              filename = cls.attrib.get("filename", "")
              line_rate = float(cls.attrib.get("line-rate", "0"))
              for key in modules:
                  if filename.startswith(f"{key}/"):
                      modules[key].append(line_rate)

          failed = []
          for key, values in modules.items():
              if not values:
                  failed.append(f"{key}: coverage verisi bulunamadi")
                  continue
              avg = (sum(values) / len(values)) * 100
              print(f"{key} coverage: {avg:.2f}%")
              if avg < 90:
                  failed.append(f"{key}: {avg:.2f}% < 90%")

          if failed:
              raise SystemExit("Critical coverage gate fail: " + "; ".join(failed))
          PY
