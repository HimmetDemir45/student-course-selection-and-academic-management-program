name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff (full project)
        run: python -m ruff check .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit -r requirements.txt --strict
      - name: Bandit SARIF
        run: |
          pip install "bandit[toml]>=1.7.10"
          bandit -c .bandit -r . -f sarif -o bandit.sarif --exit-zero
      - name: Upload SARIF (Code Scanning)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

  test:
    runs-on: ubuntu-latest
    needs: [lint, security]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: github_actions
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      DJANGO_SECRET_KEY: ci-ephemeral-placeholder-not-for-production
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/github_actions

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Django systemCheck
        run: python manage.py check

      - name: migrate
        run: python manage.py migrate --noinput

      - name: Tests + coverage threshold
        run: |
          coverage erase
          coverage run manage.py test --verbosity 2
          coverage xml
          coverage report

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Codecov upload
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          python -m cyclonedx_py requirements requirements.txt -o sbom-cyclonedx.json --no-validate
        continue-on-error: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        if: hashFiles('sbom-cyclonedx.json') != ''
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json
