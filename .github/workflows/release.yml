# Immutable release images on SemVer tags (v*). See RELEASE.md and docs/runbooks/deployment-runbook.md.
# Prod SSH/ECS deploy is environment-specific; this workflow builds, pushes, and optionally runs remote smoke.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (semver + immutable sha)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy hint (manual prod)
        run: |
          echo "## Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ornek: \`docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sunucuda: \`docker compose -f docker-compose.prod.yml up -d\` (image etiketini override edin)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Detay: \`docs/runbooks/deployment-runbook.md\`" >> "$GITHUB_STEP_SUMMARY"

  post-release-smoke:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.HEALTHCHECK_BASE_URL }}
    steps:
      - name: Remote smoke (optional)
        run: |
          set -e
          if [ -z "$BASE_URL" ]; then
            echo "HEALTHCHECK_BASE_URL secret tanimli degil; uzak smoke atlandi."
            echo "Manuel: Actions > smoke-tests workflow_dispatch ile BASE_URL verin."
            exit 0
          fi
          curl -fsS --max-time 30 "$BASE_URL/health/live/"
          curl -fsS --max-time 30 "$BASE_URL/health/ready/"
          echo "Remote smoke OK"

  rollback-hint:
    if: ${{ always() && (needs.ci.result == 'failure' || needs.build-and-push.result == 'failure' || needs.post-release-smoke.result == 'failure') }}
    needs: [ci, build-and-push, post-release-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Rollback komut ozeti
        run: |
          echo "## Rollback / geri alma" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Onceki calisan image SHA veya tag (GHCR Packages / eski release)." >> "$GITHUB_STEP_SUMMARY"
          echo "2. \`docker pull ghcr.io/${{ github.repository }}:sha-<onceki>\` + compose up -d" >> "$GITHUB_STEP_SUMMARY"
          echo "3. DB: geri alinamayan migration yoksa \`migrate\` ile uyum; aksi halde snapshot restore — bkz. docs/runbooks/rollback-runbook.md" >> "$GITHUB_STEP_SUMMARY"
