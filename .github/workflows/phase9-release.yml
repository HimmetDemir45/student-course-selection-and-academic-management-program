name: Phase 9 Release

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Release image tag (default: phase9-${{ github.sha }})"
        required: false
        default: ""
      environment:
        description: "Target environment"
        required: true
        default: "production"

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Phase 9 CI gates locally
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci
          DJANGO_SECRET_KEY: ci-ephemeral-placeholder-not-for-production
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
        run: |
          make ci

      - name: Docker login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="phase9-${GITHUB_SHA::12}"
          fi
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          docker build -t "${REGISTRY}/${IMAGE_NAME}:${{ steps.meta.outputs.image_tag }}" .
          docker push "${REGISTRY}/${IMAGE_NAME}:${{ steps.meta.outputs.image_tag }}"

  deploy:
    runs-on: ubuntu-latest
    needs: build-test
    environment: ${{ inputs.environment }}
    steps:
      - name: Deploy release image
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}:${{ needs.build-test.outputs.image_tag }}
          DEPLOY_COMMAND: ${{ secrets.RELEASE_DEPLOY_COMMAND }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_COMMAND:-}" ]; then
            echo "RELEASE_DEPLOY_COMMAND secret bos."
            exit 1
          fi
          echo "Deploying ${RELEASE_IMAGE}"
          eval "${DEPLOY_COMMAND}"

  health-check:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          test -n "${HEALTHCHECK_URL:-}"
          curl -fsS --max-time 20 "${HEALTHCHECK_URL}"

  canary:
    runs-on: ubuntu-latest
    needs: [deploy, health-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run synthetic canary
        env:
          CANARY_LOGIN_URL: ${{ secrets.CANARY_LOGIN_URL }}
          CANARY_ENROLLMENT_URL: ${{ secrets.CANARY_ENROLLMENT_URL }}
          CANARY_MAX_RESPONSE_SECONDS: ${{ secrets.CANARY_MAX_RESPONSE_SECONDS }}
        run: |
          chmod +x scripts/synthetic_canary.sh
          ./scripts/synthetic_canary.sh

  rollback:
    runs-on: ubuntu-latest
    needs: [build-test, canary]
    if: ${{ failure() && needs.canary.result == 'failure' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rollback on canary failure
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}:${{ needs.build-test.outputs.image_tag }}
          PREVIOUS_STABLE_TAG: ${{ secrets.PREVIOUS_STABLE_TAG }}
          ROLLBACK_COMMAND: ${{ secrets.RELEASE_ROLLBACK_COMMAND }}
        run: |
          set -euo pipefail
          chmod +x scripts/rollback_release.sh
          ./scripts/rollback_release.sh --image "ghcr.io/${{ github.repository }}" --tag "${PREVIOUS_STABLE_TAG}"

  summary:
    runs-on: ubuntu-latest
    needs: [build-test, deploy, health-check, canary, rollback]
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "## Phase 9 Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- build-test: ${{ needs.build-test.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- deploy: ${{ needs.deploy.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- health-check: ${{ needs.health-check.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- canary: ${{ needs.canary.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- rollback: ${{ needs.rollback.result }}" >> "$GITHUB_STEP_SUMMARY"
