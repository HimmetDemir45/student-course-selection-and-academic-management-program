<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Güvenlik doğrulaması başarısız</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="mx-auto shadow-sm bg-white p-4 p-md-5 rounded-3 border" style="max-width: 28rem;">
            <h1 class="h4 mb-3">CSRF doğrulaması başarısız</h1>
            <p class="text-muted mb-4">
                Oturum veya güvenlik jetonunuz güncellenmiş olabilir. Bu sayfayı yenileyerek formu tekrar gönderin veya çıkış yapıp yeniden giriş yapın.
            </p>
            <div class="d-grid gap-2">
                <a class="btn btn-primary" href="{% url 'accounts:login' %}">Giriş sayfasına dön</a>
                <button type="button" class="btn btn-outline-secondary" onclick="window.location.reload()">
                    Sayfayı yenile
                </button>
            </div>
        </div>
    </div>
</body>
</html>
