{% load static %}<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Güvenlik doğrulaması başarısız — Akademik 2.0</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/portal-2025.css' %}">

    <style>
      body {
        min-height: 100vh;
        margin: 0;
        background: #050816;
        color: rgba(255, 255, 255, 0.92);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        position: relative;
        overflow-x: hidden;
      }
      .csrf-bg {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: -1;
      }
      .csrf-bg::before, .csrf-bg::after {
        content: "";
        position: absolute;
        border-radius: 9999px;
        filter: blur(80px);
        opacity: 0.5;
      }
      .csrf-bg::before {
        top: -10rem; left: -10rem;
        width: 28rem; height: 28rem;
        background: rgba(244, 63, 94, 0.25);
      }
      .csrf-bg::after {
        bottom: -10rem; right: -10rem;
        width: 26rem; height: 26rem;
        background: rgba(245, 158, 11, 0.18);
      }
      .csrf-card {
        width: 100%;
        max-width: 28rem;
        padding: 2rem;
        border-radius: 1.25rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 30px 120px rgba(2, 6, 23, 0.55);
      }
      .csrf-icon {
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 1rem;
        background: linear-gradient(135deg, rgba(244, 63, 94, 0.3), rgba(244, 63, 94, 0.1));
        border: 1px solid rgba(244, 63, 94, 0.35);
        color: #fecaca;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.25rem;
      }
      .csrf-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.2rem 0.6rem;
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        border-radius: 999px;
      }
      .csrf-title {
        margin: 0.75rem 0 0;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #fff;
      }
      .csrf-desc {
        margin: 0.5rem 0 0;
        font-size: 0.875rem;
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.65);
      }
      .csrf-actions {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        margin-top: 1.75rem;
      }
    </style>
</head>
<body>
    <div class="csrf-bg" aria-hidden="true"></div>

    <main class="csrf-card" role="alert" aria-live="polite">
        <div class="csrf-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        </div>
        <span class="csrf-eyebrow">Güvenlik</span>
        <h1 class="csrf-title">CSRF doğrulaması başarısız</h1>
        <p class="csrf-desc">
            Oturum veya güvenlik jetonun güncellenmiş olabilir. Sayfayı yenileyerek formu tekrar gönder ya da çıkış yapıp yeniden giriş yap.
        </p>

        <div class="csrf-actions">
            <a class="akd-btn akd-btn--primary akd-btn--block" href="{% url 'accounts:login' %}">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
                <span>Giriş sayfasına dön</span>
            </a>
            <button type="button" class="akd-btn akd-btn--secondary akd-btn--block" onclick="window.location.reload()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
                <span>Sayfayı yenile</span>
            </button>
        </div>
    </main>
</body>
</html>
