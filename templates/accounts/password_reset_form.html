{% extends "base.html" %}

{% block title %}Sifre Sifirla{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Sifre Sifirlama</h2>
        <p>E-posta adresinizi girin, sifre sifirlama baglantisi gonderelim.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="mb-3">
                <label class="form-label">{{ form.email.label }}</label>
                {{ form.email }}
                <div class="text-danger small">{{ form.email.errors }}</div>
            </div>
            <button type="submit" class="btn btn-primary">Gonder</button>
        </form>
    </div>
</div>
{% endblock %}
