{% load i18n %}
{% if form.non_field_errors %}
<div class="alert alert-danger phase16-form-errors phase17-form-errors phase17-alert" role="alert">
    {{ form.non_field_errors }}
</div>
{% endif %}
{% for field in form %}
    {% if field.errors %}
    <div class="small mb-2 phase16-form-errors phase17-field-error" role="alert">
        <strong>{{ field.label }}:</strong> {{ field.errors|striptags }}
    </div>
    {% endif %}
{% endfor %}
