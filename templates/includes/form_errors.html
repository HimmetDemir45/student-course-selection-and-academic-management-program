{% load i18n %}
{% if form.non_field_errors %}
<div class="alert alert-danger phase16-form-errors" role="alert">
    {{ form.non_field_errors }}
</div>
{% endif %}
{% for field in form %}
    {% if field.errors %}
    <div class="text-danger small mb-2 phase16-form-errors" role="alert">
        <strong>{{ field.label }}:</strong> {{ field.errors|striptags }}
    </div>
    {% endif %}
{% endfor %}
