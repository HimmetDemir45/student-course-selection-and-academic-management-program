{% load i18n %}
{% if page_obj.has_other_pages %}
<nav class="akd-pagination" aria-label="{% trans 'Sayfalama' %}">
    {% if page_obj.has_previous %}
        <a class="akd-pagination__btn"
           href="?{% for key, value in request.GET.items %}{% if key != 'page' %}{{ key }}={{ value|urlencode }}&{% endif %}{% endfor %}page={{ page_obj.previous_page_number }}"
           aria-label="{% trans 'Önceki sayfa' %}">
            <i data-lucide="chevron-left" class="h-4 w-4"></i>
            <span class="sr-only">{% trans "Önceki" %}</span>
        </a>
    {% else %}
        <span class="akd-pagination__btn is-disabled" aria-disabled="true">
            <i data-lucide="chevron-left" class="h-4 w-4"></i>
        </span>
    {% endif %}

    <span class="akd-pagination__btn is-active" aria-current="page">
        {{ page_obj.number }} <span class="text-white/50 mx-1">/</span> {{ page_obj.paginator.num_pages }}
    </span>

    {% if page_obj.has_next %}
        <a class="akd-pagination__btn"
           href="?{% for key, value in request.GET.items %}{% if key != 'page' %}{{ key }}={{ value|urlencode }}&{% endif %}{% endfor %}page={{ page_obj.next_page_number }}"
           aria-label="{% trans 'Sonraki sayfa' %}">
            <i data-lucide="chevron-right" class="h-4 w-4"></i>
            <span class="sr-only">{% trans "Sonraki" %}</span>
        </a>
    {% else %}
        <span class="akd-pagination__btn is-disabled" aria-disabled="true">
            <i data-lucide="chevron-right" class="h-4 w-4"></i>
        </span>
    {% endif %}
</nav>
{% endif %}
