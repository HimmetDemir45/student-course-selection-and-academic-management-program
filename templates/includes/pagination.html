{% load i18n %}
{% if page_obj.has_other_pages %}
<nav class="mt-3" aria-label="{% trans 'Sayfalama' %}">
    <ul class="pagination pagination-sm justify-content-center flex-wrap mb-0">
        {% if page_obj.has_previous %}
        <li class="page-item">
            <a class="page-link" href="?{% for key, value in request.GET.items %}{% if key != 'page' %}{{ key }}={{ value|urlencode }}&{% endif %}{% endfor %}page={{ page_obj.previous_page_number }}">{% trans "Önceki" %}</a>
        </li>
        {% endif %}
        <li class="page-item disabled">
            <span class="page-link">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
        </li>
        {% if page_obj.has_next %}
        <li class="page-item">
            <a class="page-link" href="?{% for key, value in request.GET.items %}{% if key != 'page' %}{{ key }}={{ value|urlencode }}&{% endif %}{% endfor %}page={{ page_obj.next_page_number }}">{% trans "Sonraki" %}</a>
        </li>
        {% endif %}
    </ul>
</nav>
{% endif %}
