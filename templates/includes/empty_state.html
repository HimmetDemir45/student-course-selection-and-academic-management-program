{% load i18n %}
<div class="phase16-empty-state phase17-empty-state mb-4" role="status">
    <div class="d-flex gap-3 align-items-start">
        <div class="phase17-empty-state__mark flex-shrink-0" aria-hidden="true"></div>
        <div class="flex-grow-1 min-w-0">
            <p class="mb-1 fw-semibold">{{ empty_title }}</p>
            <p class="mb-0 text-muted">{{ empty_message }}</p>
            {% if empty_action_url and empty_action_label %}
            <div class="mt-3">
                <a class="btn btn-sm btn-primary" href="{{ empty_action_url }}">{{ empty_action_label }}</a>
            </div>
            {% endif %}
        </div>
    </div>
</div>
