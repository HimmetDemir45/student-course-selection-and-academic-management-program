{% load i18n %}
<div class="akd-empty akd-fade-in" role="status">
    <div class="akd-empty__icon" aria-hidden="true">
        <i data-lucide="{{ empty_icon|default:'inbox' }}" class="h-5 w-5"></i>
    </div>
    {% if empty_title %}
    <p class="akd-empty__title">{{ empty_title }}</p>
    {% endif %}
    {% if empty_message %}
    <p class="akd-empty__desc">{{ empty_message }}</p>
    {% endif %}
    {% if empty_action_url and empty_action_label %}
    <div class="akd-empty__actions">
        <a class="akd-btn akd-btn--primary akd-btn--sm" href="{{ empty_action_url }}">
            <i data-lucide="plus" class="h-4 w-4"></i>
            <span>{{ empty_action_label }}</span>
        </a>
    </div>
    {% endif %}
</div>
