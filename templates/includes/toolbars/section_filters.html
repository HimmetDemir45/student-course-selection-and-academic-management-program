{% load i18n %}
<div class="md:col-span-2">
    <label for="filter-semester" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-white/50 mb-2">{% trans "Dönem" %}</label>
    <select id="filter-semester"
            class="w-full rounded-2xl border border-slate-200/70 dark:border-white/10 bg-white/60 dark:bg-white/5 px-3 py-2.5 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500/30 transition"
            name="semester"
            aria-label="{% trans 'Dönem filtresi' %}">
        <option value="">{% trans "Tümü" %}</option>
        {% for s in filter_semesters %}
            <option value="{{ s.pk }}" {% if current_filters.semester == s.pk|stringformat:"s" %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
    </select>
</div>
<div class="md:col-span-3">
    <label for="filter-dept" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-white/50 mb-2">{% trans "Bölüm" %}</label>
    <select id="filter-dept"
            class="w-full rounded-2xl border border-slate-200/70 dark:border-white/10 bg-white/60 dark:bg-white/5 px-3 py-2.5 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500/30 transition"
            name="department"
            aria-label="{% trans 'Bölüm filtresi' %}">
        <option value="">{% trans "Tümü" %}</option>
        {% for d in filter_departments %}
            <option value="{{ d.pk }}" {% if current_filters.department == d.pk|stringformat:"s" %}selected{% endif %}>{{ d.code }} — {{ d.name }}</option>
        {% endfor %}
    </select>
</div>
<div class="md:col-span-2">
    <label for="filter-sort" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-white/50 mb-2">{% trans "Sıralama" %}</label>
    <select id="filter-sort"
            class="w-full rounded-2xl border border-slate-200/70 dark:border-white/10 bg-white/60 dark:bg-white/5 px-3 py-2.5 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500/30 transition"
            name="sort"
            aria-label="{% trans 'Sıralama' %}">
        <option value="code" {% if current_filters.sort == "code" %}selected{% endif %}>{% trans "Ders kodu (A→Z)" %}</option>
        <option value="code_desc" {% if current_filters.sort == "code_desc" %}selected{% endif %}>{% trans "Ders kodu (Z→A)" %}</option>
        <option value="semester" {% if current_filters.sort == "semester" %}selected{% endif %}>{% trans "Dönem" %}</option>
        <option value="cap" {% if current_filters.sort == "cap" %}selected{% endif %}>{% trans "Kontenjan (önce uygun)" %}</option>
        <option value="cap_desc" {% if current_filters.sort == "cap_desc" %}selected{% endif %}>{% trans "Kontenjan (önce dolu)" %}</option>
    </select>
</div>
<div class="md:col-span-3 flex items-center gap-3 pt-1">
    <label class="inline-flex items-center gap-2 rounded-2xl border border-slate-200/70 dark:border-white/10 bg-white/60 dark:bg-white/5 px-3 py-2.5 text-sm text-slate-700 dark:text-white/70">
        <input class="h-4 w-4 rounded border-slate-300 dark:border-white/20 text-indigo-600 focus:ring-indigo-500/30"
               type="checkbox"
               name="avail"
               value="1"
               id="filter-avail"
               {% if current_filters.avail == "1" %}checked{% endif %}>
        <span class="text-sm">{% trans "Yalnızca kontenjanı uygun şubeler" %}</span>
    </label>
</div>
