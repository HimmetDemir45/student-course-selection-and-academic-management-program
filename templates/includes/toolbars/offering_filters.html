{% load i18n %}
<div class="md:col-span-2">
    <label for="off-sem" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-white/50 mb-2">{% trans "Dönem" %}</label>
    <select id="off-sem"
            class="w-full rounded-2xl border border-slate-200/70 dark:border-white/10 bg-white/60 dark:bg-white/5 px-3 py-2.5 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500/30 transition"
            name="semester"
            aria-label="{% trans 'Dönem filtresi' %}">
        <option value="">{% trans "Tümü" %}</option>
        {% for s in filter_semesters %}
        <option value="{{ s.pk }}" {% if current_filters.semester == s.pk|stringformat:"s" %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
    </select>
</div>
<div class="md:col-span-2">
    <label for="off-sort" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-white/50 mb-2">{% trans "Sıralama" %}</label>
    <select id="off-sort"
            class="w-full rounded-2xl border border-slate-200/70 dark:border-white/10 bg-white/60 dark:bg-white/5 px-3 py-2.5 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500/30 transition"
            name="sort"
            aria-label="{% trans 'Sıralama' %}">
        <option value="code" {% if current_filters.sort == "code" %}selected{% endif %}>{% trans "Ders kodu" %}</option>
        <option value="semester" {% if current_filters.sort == "semester" %}selected{% endif %}>{% trans "Dönem" %}</option>
        <option value="section" {% if current_filters.sort == "section" %}selected{% endif %}>{% trans "Şube" %}</option>
    </select>
</div>
