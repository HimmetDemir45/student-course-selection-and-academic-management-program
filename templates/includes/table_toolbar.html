{% load i18n %}
<form class="row g-2 align-items-end mb-3 phase16-toolbar" method="get" role="search" aria-label="{{ toolbar_aria_label }}">
    <div class="col-md-4">
        <label for="{{ toolbar_search_id|default:'toolbar-q' }}" class="form-label small mb-0">{% trans "Arama" %}</label>
        <input
            id="{{ toolbar_search_id|default:'toolbar-q' }}"
            class="form-control form-control-sm"
            type="search"
            name="q"
            value="{{ current_filters.q }}"
            placeholder="{{ toolbar_search_placeholder }}"
            aria-label="{{ toolbar_search_aria_label }}"
        >
    </div>
    {% if toolbar_filters_template %}
        {% include toolbar_filters_template %}
    {% endif %}
    <div class="col-md-2">
        <button type="submit" class="btn btn-sm btn-primary w-100">{% trans "Uygula" %}</button>
    </div>
    <div class="col-md-2">
        <a class="btn btn-sm btn-outline-secondary w-100" href="{{ toolbar_reset_url }}">{% trans "Temizle" %}</a>
    </div>
</form>
