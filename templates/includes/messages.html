{% load i18n %}
{% if messages %}
    <div class="akd-alerts" role="region" aria-label="{% trans 'Sistem mesajları' %}">
    {% for message in messages %}
        {% if message.tags == 'error' %}
            <div class="akd-alert akd-alert--danger akd-fade-in" role="alert">
                <i data-lucide="alert-circle" class="akd-alert__icon" aria-hidden="true"></i>
                <span>{{ message }}</span>
            </div>
        {% elif message.tags == 'success' %}
            <div class="akd-alert akd-alert--success akd-fade-in" role="status">
                <i data-lucide="check-circle-2" class="akd-alert__icon" aria-hidden="true"></i>
                <span>{{ message }}</span>
            </div>
        {% elif message.tags == 'warning' %}
            <div class="akd-alert akd-alert--warning akd-fade-in" role="alert">
                <i data-lucide="alert-triangle" class="akd-alert__icon" aria-hidden="true"></i>
                <span>{{ message }}</span>
            </div>
        {% else %}
            <div class="akd-alert akd-alert--info akd-fade-in" role="status">
                <i data-lucide="info" class="akd-alert__icon" aria-hidden="true"></i>
                <span>{{ message }}</span>
            </div>
        {% endif %}
    {% endfor %}
    </div>
{% endif %}
