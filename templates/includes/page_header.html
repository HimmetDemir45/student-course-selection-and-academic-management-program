{% load i18n %}
<div class="phase17-page-header d-flex flex-wrap justify-content-between align-items-start gap-3">
  <div class="phase17-page-header__titles flex-grow-1 min-w-0">
    {% if header_eyebrow %}
    <p class="phase17-page-header__eyebrow mb-1">{{ header_eyebrow }}</p>
    {% endif %}
    <h1 class="phase17-page-header__title h4 mb-0">{{ header_title }}</h1>
    {% if header_subtitle %}
    <p class="phase17-page-header__subtitle text-muted small mb-0 mt-2">{{ header_subtitle }}</p>
    {% endif %}
  </div>
  {% if header_actions_template %}
  <div class="phase17-page-header__actions d-flex flex-wrap gap-2 align-items-center flex-shrink-0">
    {% include header_actions_template %}
  </div>
  {% endif %}
</div>
