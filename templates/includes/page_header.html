{% load i18n %}
<header class="akd-page-header">
    <div class="akd-page-header__intro">
        {% if header_eyebrow %}
        <span class="akd-page-header__eyebrow">{{ header_eyebrow }}</span>
        {% endif %}
        <h1 class="akd-page-header__title">{{ header_title }}</h1>
        {% if header_subtitle %}
        <p class="akd-page-header__subtitle">{{ header_subtitle }}</p>
        {% endif %}
    </div>
    {% if header_actions_template %}
    <div class="akd-page-header__actions">
        {% include header_actions_template %}
    </div>
    {% endif %}
</header>
